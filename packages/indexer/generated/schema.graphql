"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Meta {
  status: JSON
}

type Query {
  riskEvent(id: String!): riskEvent
  riskEvents(where: riskEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): riskEventPage!
  escalationEvent(id: String!): escalationEvent
  escalationEvents(where: escalationEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): escalationEventPage!
  threatVectorUpdate(id: String!): threatVectorUpdate
  threatVectorUpdates(where: threatVectorUpdateFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): threatVectorUpdatePage!
  odigExecution(id: String!): odigExecution
  odigExecutions(where: odigExecutionFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): odigExecutionPage!
  _meta: Meta
}

