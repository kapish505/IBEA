[profile.default]
src         = "src"
out         = "out"
libs        = ["lib"]
test        = "test"
script      = "script"
optimizer   = true
optimizer_runs = 200
solc_version   = "0.8.24"
via_ir         = false
ffi            = false
verbosity      = 2


[profile.default.rpc_endpoints]
somnia_shannon = "${SOMNIA_RPC_URL}"

[profile.default.etherscan]
somnia_shannon = { key = "no-key-needed", url = "${SOMNIA_EXPLORER}/api" }

[fmt]
line_length    = 120
tab_width      = 4
bracket_spacing = true
int_types      = "long"
multiline_func_header = "all"

[doc]
out = "docs"
title = "IBEA Smart Contracts"
